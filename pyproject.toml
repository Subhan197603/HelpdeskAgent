[project]
name = "fusion-ai-helpdesk"
version = "0.0.0"
description = "Fusion AI Helpdesk modular monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "boto3>=1.40,<2",
  "beautifulsoup4>=4.13,<5",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["apps/api/tests", "apps/worker/tests", "tests"]
pythonpath = ["."]
markers = [
  "integration: tests requiring local infrastructure",
  "container: tests requiring Docker and an API image build",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["database/baseline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "ingestion", "tests"]
exclude = ["database/baseline"]
