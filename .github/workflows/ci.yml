name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: make bootstrap
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test
      - name: Audit dependencies
        run: |
          uv run pip-audit
          pnpm audit --audit-level high
      - name: Validate Compose model
        run: make compose-validate

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  foundation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Test PostgreSQL baseline, Alembic adoption, and API foundation
        run: make db-test

  retrieval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Enforce retrieval ACL, quality, evidence, and latency thresholds
        run: >-
          uv run pytest tests/integration/test_document_acquisition.py
          -k retrieval_regression_corpus_quality_acl_evidence_and_latency
          -m integration

  portal-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Test employee-to-analyst vertical slice
        run: pnpm test:e2e

  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file infrastructure/docker/api.Dockerfile --tag fusion-ai-helpdesk-api:ci .
      - name: Build web image
        run: docker build --file infrastructure/docker/web.Dockerfile --tag fusion-ai-helpdesk-web:ci .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.70.0
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fusion-ai-helpdesk-api:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fusion-ai-helpdesk-web:ci
          version: v0.70.0
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
